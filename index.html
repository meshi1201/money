<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#F5C94E;
  --yellow-light:#FFF8D6;
  --yellow-pale:#FFFBED;
  --pink:#F2A7BF;
  --pink-light:#FDE8EF;
  --salmon:#E8887A;
  --cream:#FDF6E3;
  --brown:#8B6340;
  --text:#1a1a1a;
  --text-mid:#555;
  --text-light:#888;
  --border:#F0D88A;
  --card-bg:#FFFDF5;
}
html,body{height:100%;background:var(--yellow-pale);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:var(--text)}
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:var(--cream)}
.header{background:var(--yellow);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #E8B830;position:sticky;top:0;z-index:100}
.header-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.5px}
.header-title span{color:var(--salmon)}
.header-avatar{width:36px;height:36px;border-radius:50%;border:2.5px solid #fff;overflow:hidden;cursor:pointer;background:var(--pink-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-avatar img{width:100%;height:100%;object-fit:cover}
.header-avatar-placeholder{font-size:16px;color:var(--salmon)}
.avatar-hint{text-align:center;font-size:11px;color:var(--text-light);padding:3px 0;background:var(--yellow-light);border-bottom:1px solid var(--border)}
.compose{background:var(--card-bg);border-bottom:1.5px solid var(--border);padding:12px 14px}
.compose-row{display:flex;gap:10px;align-items:flex-start}
.compose-avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--yellow);overflow:hidden;flex-shrink:0;background:var(--pink-light);display:flex;align-items:center;justify-content:center}
.compose-avatar img{width:100%;height:100%;object-fit:cover}
.compose-avatar-ph{font-size:18px;color:var(--salmon)}
.compose-fields{flex:1;display:flex;flex-direction:column;gap:7px}
.compose-memo{width:100%;border:1.5px solid var(--border);border-radius:18px;padding:9px 14px;font-size:15px;background:#fff;color:var(--text);outline:none;resize:none}
.compose-memo:focus{border-color:var(--yellow)}
.compose-bottom{display:flex;gap:7px;align-items:center}
.compose-amount{flex:1;border:1.5px solid var(--border);border-radius:18px;padding:7px 12px;font-size:14px;background:#fff;color:var(--text);outline:none}
.compose-amount:focus{border-color:var(--yellow)}
.compose-genre{border:1.5px solid var(--border);border-radius:18px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text);outline:none}
.compose-genre:focus{border-color:var(--yellow)}
.post-btn{padding:7px 18px;background:var(--yellow);border:none;border-radius:99px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.post-btn:active{transform:scale(.97)}
.summary-bar{display:flex;background:var(--yellow-light);border-bottom:1px solid var(--border)}
.sum-item{flex:1;padding:8px 10px;text-align:center;border-right:1px solid var(--border)}
.sum-item:last-child{border-right:none}
.sum-val{font-size:15px;font-weight:700;color:var(--text)}
.sum-lbl{font-size:10px;color:var(--text-light)}
.filter-row{display:flex;gap:5px;overflow-x:auto;padding:8px 12px;background:var(--cream);border-bottom:1px solid var(--border);scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{white-space:nowrap;font-size:12px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--border);background:#fff;color:var(--text-mid);cursor:pointer;flex-shrink:0}
.filter-btn.active{background:var(--yellow);border-color:var(--yellow);color:var(--text);font-weight:600}
.feed{flex:1;overflow-y:auto;padding:0}
.post{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border);background:var(--card-bg)}
.post:active{background:var(--yellow-pale)}
.post-ava{width:40px;height:40px;border-radius:50%;border:2px solid var(--yellow);overflow:hidden;flex-shrink:0;background:var(--pink-light);display:flex;align-items:center;justify-content:center}
.post-ava img{width:100%;height:100%;object-fit:cover}
.post-ava-ph{font-size:18px;color:var(--salmon)}
.post-body{flex:1;min-width:0}
.post-header{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.post-name{font-size:14px;font-weight:600;color:var(--text)}
.post-time{font-size:11px;color:var(--text-light)}
.post-memo{font-size:15px;color:var(--text);margin-bottom:6px;word-break:break-all}
.post-amount{font-size:18px;font-weight:700;color:var(--salmon);margin-bottom:7px}
.post-footer{display:flex;justify-content:space-between;align-items:center}
.genre-pill{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.post-actions{display:flex;gap:2px}
.act-btn{background:none;border:none;cursor:pointer;padding:4px 7px;border-radius:99px;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text-mid)}
.act-btn:hover{background:var(--yellow-pale)}
.act-btn.liked{color:var(--salmon)}
.act-label{font-size:11px}
.empty{text-align:center;padding:3rem 1rem;color:var(--text-light);font-size:14px}
.empty-emoji{font-size:40px;margin-bottom:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:var(--cream);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 18px 32px;border-top:3px solid var(--yellow)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-mid)}
.modal input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;margin-bottom:14px;color:var(--text)}
.modal-upload{width:100%;background:var(--yellow-light);border:2px dashed var(--yellow);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--text-mid);font-size:13px;margin-bottom:14px}
.modal-upload:hover{background:var(--yellow-pale)}
.modal-save{width:100%;padding:12px;background:var(--yellow);border:none;border-radius:99px;font-size:15px;font-weight:700;cursor:pointer;color:var(--text)}
.modal-save:active{transform:scale(.98)}
.modal-cancel{display:block;text-align:center;margin-top:10px;font-size:13px;color:var(--text-light);cursor:pointer}
.g-食費{background:#FDE8A0;color:#7A5200}
.g-日用品{background:#C8E6FF;color:#0A4070}
.g-交通費{background:#FFE0C0;color:#7A3400}
.g-娯楽{background:#F9D0E0;color:#7A1040}
.g-衣服{background:#E8D0FF;color:#3A1080}
.g-医療{background:#D0F0C0;color:#205010}
.g-その他{background:#E8E4D8;color:#4A4030}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-title">家計簿<span>TL</span></div>
    <div class="header-avatar" id="headerAva" onclick="openModal()" title="プロフィール設定">
      <span class="header-avatar-placeholder" id="headerAvaPlaceholder">🌸</span>
      <img id="headerAvaImg" style="display:none" alt="avatar">
    </div>
  </header>
  <div class="avatar-hint">↑ アイコンをタップしてプロフィール設定</div>
  <div class="compose">
    <div class="compose-row">
      <div class="compose-avatar">
        <span class="compose-avatar-ph" id="cAvaPlaceholder">🌸</span>
        <img id="cAvaImg" style="display:none" alt="avatar">
      </div>
      <div class="compose-fields">
        <textarea class="compose-memo" id="memo" rows="2" placeholder="何を買いましたか？"></textarea>
        <div class="compose-bottom">
          <input type="number" class="compose-amount" id="amount" placeholder="金額（円）" min="0">
          <select class="compose-genre" id="genre">
            <option>食費</option><option>日用品</option><option>交通費</option>
            <option>娯楽</option><option>衣服</option><option>医療</option><option>その他</option>
          </select>
          <button class="post-btn" onclick="addPost()">投稿</button>
        </div>
      </div>
    </div>
  </div>
  <div class="summary-bar" id="summaryBar"></div>
  <div class="filter-row" id="filterRow"></div>
  <div class="feed" id="feed"></div>
</div>
<div class="modal-bg hidden" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title">プロフィール設定</div>
    <label>表示名</label>
    <input type="text" id="profileName" placeholder="例：わたし" maxlength="20">
    <label>アイコン画像</label>
    <div class="modal-upload" onclick="document.getElementById('avatarInput').click()">
      📷 タップして画像を選択<br><small style="font-size:11px;color:#aaa">好きな画像をアイコンに設定できます</small>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="loadAvatar(event)">
    <canvas id="avatarCanvas" style="display:none"></canvas>
    <div id="avatarPreviewWrap" style="display:none;text-align:center;margin-bottom:14px">
      <img id="avatarPreview" style="width:64px;height:64px;border-radius:50%;border:2px solid #F5C94E;object-fit:cover" alt="preview">
      <p style="font-size:11px;color:#888;margin-top:4px">プレビュー</p>
    </div>
    <button class="modal-save" onclick="saveProfile()">保存</button>
    <span class="modal-cancel" onclick="closeModal()">キャンセル</span>
  </div>
</div>
<script>
const GENRE_COLORS={'食費':'g-食費','日用品':'g-日用品','交通費':'g-交通費','娯楽':'g-娯楽','衣服':'g-衣服','医療':'g-医療','その他':'g-その他'};
let records=[];let likes={};let activeFilter='すべて';
let profile={name:'わたし',avatarDataUrl:null};
let pendingAvatar=null;
try{records=JSON.parse(localStorage.getItem('kakeiboTL_records')||'[]')}catch(e){}
try{likes=JSON.parse(localStorage.getItem('kakeiboTL_likes')||'{}')}catch(e){}
try{const p=JSON.parse(localStorage.getItem('kakeiboTL_profile')||'null');if(p)profile=p;}catch(e){}
function save(){try{localStorage.setItem('kakeiboTL_records',JSON.stringify(records));localStorage.setItem('kakeiboTL_likes',JSON.stringify(likes));localStorage.setItem('kakeiboTL_profile',JSON.stringify(profile));}catch(e){}}
function nowStr(){const d=new Date();return{date:d.toISOString().slice(0,10),ts:d.getTime()};}
function relTime(ts){const diff=Date.now()-ts;if(diff<60000)return 'たった今';if(diff<3600000)return Math.floor(diff/60000)+'分前';if(diff<86400000)return Math.floor(diff/3600000)+'時間前';const d=new Date(ts);return(d.getMonth()+1)+'月'+d.getDate()+'日';}
function addPost(){const memo=document.getElementById('memo').value.trim();const amount=parseInt(document.getElementById('amount').value);const genre=document.getElementById('genre').value;if(!memo||!amount||amount<=0)return;const{date,ts}=nowStr();records.unshift({id:ts,memo,amount,genre,date,ts});save();document.getElementById('memo').value='';document.getElementById('amount').value='';render();}
function toggleLike(id){likes[id]=!likes[id];save();render();}
function deleteRecord(id){records=records.filter(r=>r.id!==id);delete likes[id];save();render();}
function setFilter(g){activeFilter=g;render();}
function applyAvatar(){const imgs=[document.getElementById('headerAvaImg'),document.getElementById('cAvaImg')];const phs=[document.getElementById('headerAvaPlaceholder'),document.getElementById('cAvaPlaceholder')];if(profile.avatarDataUrl){imgs.forEach(i=>{i.src=profile.avatarDataUrl;i.style.display='block'});phs.forEach(p=>p.style.display='none');}else{imgs.forEach(i=>i.style.display='none');phs.forEach(p=>p.style.display='');}}
function render(){
  applyAvatar();
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTotal=records.filter(r=>r.date.startsWith(thisMonth)).reduce((s,r)=>s+r.amount,0);
  const total=records.reduce((s,r)=>s+r.amount,0);
  document.getElementById('summaryBar').innerHTML='<div class="sum-item"><div class="sum-val">¥'+monthTotal.toLocaleString()+'</div><div class="sum-lbl">今月</div></div><div class="sum-item"><div class="sum-val">'+records.length+'</div><div class="sum-lbl">件数</div></div><div class="sum-item"><div class="sum-val">¥'+(records.length?Math.round(total/records.length).toLocaleString():0)+'</div><div class="sum-lbl">平均</div></div>';
  const usedGenres=['すべて',...Object.keys(GENRE_COLORS).filter(g=>records.some(r=>r.genre===g))];
  document.getElementById('filterRow').innerHTML=usedGenres.map(g=>'<button class="filter-btn'+(activeFilter===g?' active':'')+'" onclick="setFilter(\''+g+'\')">'+g+'</button>').join('');
  const filtered=activeFilter==='すべて'?records:records.filter(r=>r.genre===activeFilter);
  const feed=document.getElementById('feed');
  if(!filtered.length){feed.innerHTML='<div class="empty"><div class="empty-emoji">🌸</div>記録がありません<br>上から追加してみよう</div>';return;}
  const avaHtml=profile.avatarDataUrl?'<img src="'+profile.avatarDataUrl+'" alt="avatar" style="width:100%;height:100%;object-fit:cover">':"<span class='post-ava-ph'>🌸</span>";
  feed.innerHTML=filtered.map(r=>{const gc=GENRE_COLORS[r.genre]||'g-その他';const liked=likes[r.id];return '<div class="post"><div class="post-ava">'+avaHtml+'</div><div class="post-body"><div class="post-header"><span class="post-name">'+(profile.name||'わたし')+'</span><span class="post-time">'+relTime(r.ts)+' · '+r.date.slice(5).replace('-','/')+'</span></div><div class="post-memo">'+r.memo+'</div><div class="post-amount">¥'+r.amount.toLocaleString()+'</div><div class="post-footer"><span class="genre-pill '+gc+'">'+r.genre+'</span><div class="post-actions"><button class="act-btn'+(liked?' liked':'')+'" onclick="toggleLike('+r.id+')">❤ <span class="act-label">'+(liked?1:0)+'</span></button><button class="act-btn" onclick="deleteRecord('+r.id+')">🗑</button></div></div></div></div>';}).join('');
}
function openModal(){document.getElementById('profileName').value=profile.name||'';pendingAvatar=null;document.getElementById('avatarPreviewWrap').style.display='none';document.getElementById('modalBg').classList.remove('hidden');}
function closeModal(){document.getElementById('modalBg').classList.add('hidden');}
function closeModalBg(e){if(e.target===document.getElementById('modalBg'))closeModal();}
function loadAvatar(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const canvas=document.getElementById('avatarCanvas');const size=200;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const min=Math.min(img.width,img.height);const sx=(img.width-min)/2,sy=(img.height-min)/2;ctx.drawImage(img,sx,sy,min,min,0,0,size,size);pendingAvatar=canvas.toDataURL('image/jpeg',0.7);document.getElementById('avatarPreview').src=pendingAvatar;document.getElementById('avatarPreviewWrap').style.display='block';};img.src=ev.target.result;};reader.readAsDataURL(file);}
function saveProfile(){profile.name=document.getElementById('profileName').value.trim()||'わたし';if(pendingAvatar)profile.avatarDataUrl=pendingAvatar;save();closeModal();render();}
document.getElementById('memo').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('amount').focus();}});
document.getElementById('amount').addEventListener('keydown',e=>{if(e.key==='Enter')addPost();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
</body>
</html>
